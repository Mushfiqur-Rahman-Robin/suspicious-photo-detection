[build-system]
# Modern build backend: zero setup.py, src-layout aware, fast, and the default
# recommended backend for new packages (used by uv, PyPA, and the wider ecosystem).
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "suspicious-photo-detection"
version = "0.1.0"
description = "Suspicious Photo Detection - a batch ML pipeline that flags visually inconsistent outlet verification images."
license = "LicenseRef-Proprietary"
requires-python = ">=3.13"
authors = [
    { name = "Suspicious Photo Detection Team", email = "mushfiqur.rahman.robin@gmail.com" },
]
keywords = [
    "computer-vision",
    "anomaly-detection",
    "outlier-detection",
    "image-embeddings",
    "dinov2",
    "clip",
    "unsupervised",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    # Array / math (vectorized similarity, MAD, distances)
    "numpy>=1.26",
    "scipy>=1.12",
    # Unsupervised outlier detection (Isolation Forest, pairwise distances)
    "scikit-learn>=1.4",
    # Image decode / preprocessing
    "pillow>=10.0",
    # Embedding backbone (DINOv2 via torchvision; model-agnostic per ED-1)
    "torch>=2.6",
    "torchvision>=0.21",
    # Validation & config (type-safety skill: strict Pydantic at every boundary)
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    # CLI (typed, self-documenting)
    "typer>=0.12",
    # Observability (structured logs + timing)
    "structlog>=24.1",
]

[project.optional-dependencies]
# Alternate embedding backend (semantic features). Kept out of the core deps so
# the default DINOv2 path has a minimal, GPU/CPU-friendly footprint (ED-1).
# NOTE: the CLIP path is NOT part of the locked core environment (ED-6); a CLIP
# run must first compile a dedicated lockfile (`uv pip compile --extra clip`)
# so the open_clip weights + torch pairing stay deterministic (SPEC §13).
clip = [
    "open-clip-torch>=3.3.0,<4",
]

# Test harness (test-runner skill). Installed in CI for unit + integration tests.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Lint + static analysis (naming, complexity, dead-code skills).
lint = [
    "ruff>=0.6",
    "bandit>=1.7",
    "vulture>=2.11",
]

# Static type checking (type-safety skill).
types = [
    "mypy>=1.11",
    "pyright>=1.1.370",
]

# Security scanning (dependency-management / security-auditer skills).
security = [
    "pip-audit>=2.7",
]

# Documentation site (mkdocs). Used by the docs build job in CI. Included in
# the `dev` extra so a single locked `requirements-dev.txt` covers all of CI.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

# Everything a developer needs for the day-to-day inner loop.
# Self-reference keeps `dev` in sync with the groups above without duplication.
dev = [
    "suspicious-photo-detection[test,lint,types,security,docs]",
]

[project.urls]
Homepage = "https://github.com/Mushfiqur-Rahman-Robin/suspicious-photo-detection"
Repository = "https://github.com/Mushfiqur-Rahman-Robin/suspicious-photo-detection"
Issues = "https://github.com/Mushfiqur-Rahman-Robin/suspicious-photo-detection/issues"

[project.scripts]
spd = "cli.app:app"

[tool.hatch.build.targets.wheel]
# Flat src layout: modules live directly under `src/` (no nested
# `suspicious_photo_detection/` package). Each is a separate top-level package.
packages = [
    "src/config",
    "src/core",
    "src/embedding",
    "src/scoring",
    "src/detection",
    "src/pipeline",
    "src/io",
    "src/reporting",
    "src/cli",
    "src/observability",
]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    ".mypy_cache",
    "htmlcov",
]

[tool.ruff.lint]
# E,F,W = pycodestyle/pyflakes; I = isort; N = pep8-naming; UP = pyupgrade;
# B = bugbear; RUF = ruff-specific; D = pydocstyle; ANN = annotations;
# S = bandit; C4 = comprehensions; SIM = simplify; RET = returns;
# T20 = prints; ERA = commented-out code; PIE = misc; ARG = unused-args;
# BLE = blind except. (D/ANN are REQUIRED, not ignored, to satisfy the
# project's docstring + type-safety standards - AGENTS.md / SPEC §20.)
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "RUF",
    "D",
    "ANN",
    "S",
    "C4",
    "SIM",
    "RET",
    "T20",
    "ERA",
    "PIE",
    "ARG",
    "BLE",
]
ignore = [
    # Handled by `ruff format` (the formatter), not the linter.
    "E501",
    # Occasionally required (e.g., plugin imports).
    "E402",
    # Micro-stylistic; the formatter owns these.
    "E701",
    "E712",
    # Subjective style rules whose value is outweighed by noise.
    "RUF001",  # ambiguous unicode
    "RUF002",  # ambiguous docstring unicode
    "RUF003",  # ambiguous comment unicode
]

[tool.ruff.lint.per-file-ignores]
# Tests: no docstring/annotation requirements; asserts are expected.
"tests/**/*.py" = ["D", "ANN", "S101", "ARG"]

[tool.ruff.lint.pydocstyle]
# Project requires PEP 257 docstrings (AGENTS.md / SPEC §20).
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = [
    "config",
    "core",
    "embedding",
    "scoring",
    "detection",
    "pipeline",
    "io",
    "reporting",
    "cli",
    "observability",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy: strict static typing
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["tests"]
warn_unused_configs = true
show_error_codes = true
pretty = true

# ---------------------------------------------------------------------------
# pyright: complementary static checker (kept compatible with mypy config)
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# pytest: test discovery + behavior
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "-ra",
    "--tb=short",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-report=html",
    "--junit-xml=pytest-report.xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
# Overall project threshold (test-runner skill: >= 80% overall, >= 85% core).
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------------------------
# Bandit: security-focused static analysis
# ---------------------------------------------------------------------------
[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert usage is acceptable in tests; asserted elsewhere

# ---------------------------------------------------------------------------
# Vulture: dead-code detection
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["src"]
exclude = ["tests", "conftest.py"]
min_confidence = 80
sort_by_size = true
# `cls` is the required first parameter of @classmethod validators (PEP 257
# convention); vulture cannot see the framework-side call.
ignore_names = ["cls"]

# ---------------------------------------------------------------------------
# Commitizen: conventional-commit releases
# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
]
update_changelog_on_bump = true
bump_message = "chore(release): bump version to $new_version"
check_consistency = true
changelog_file = "docs/CHANGELOG.md"
commit_message_format = "{type}({scope}): {subject}"

[tool.commitizen.types]
feat = { description = "A new feature" }
fix = { description = "A bug fix" }
docs = { description = "Documentation only changes" }
style = { description = "Changes that do not affect the meaning of the code (white-space, formatting, missing semi-colons, etc)" }
refactor = { description = "A code change that neither fixes a bug nor adds a feature" }
test = { description = "Adding missing tests or correcting existing tests" }
chore = { description = "Changes to the build process or auxiliary tools and libraries such as documentation generation" }
perf = { description = "A code change that improves performance" }
build = { description = "Changes that affect the build system or external dependencies" }
ci = { description = "Changes to our CI configuration files and scripts" }

[tool.commitizen.scopes]
core = { description = "Core functionality" }
embedding = { description = "Embedding extraction and cache" }
scoring = { description = "Similarity and suspicion scoring" }
detection = { description = "Outlier detection and flagging" }
pipeline = { description = "Pipeline orchestration" }
cli = { description = "Command-line interface" }
io = { description = "Dataset loading and result writing" }
deps = { description = "Dependency management" }
docs = { description = "Project documentation" }
